services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: leaseflow
      POSTGRES_USER: leaseflow
      POSTGRES_PASSWORD: leaseflow
    ports:
      - "5432:5432"
    volumes:
      - leaseflow-pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaseflow -d leaseflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: LeaseFlow AI
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://leaseflow:leaseflow@postgres:5432/leaseflow
      STORAGE_DIR: /data/uploads
      MAX_UPLOAD_BYTES: "10485760"
      CORS_ORIGINS: http://localhost:3000
      EXTRACTION_PROVIDER: fixture
      DEMO_ACTOR: demo-reviewer
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"
    volumes:
      - leaseflow-data:/data
      - ./samples:/app/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.mcp.servers.healthcheck
    environment:
      DATABASE_URL: sqlite:////data/leaseflow.db
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from app.mcp.servers.healthcheck import verify; verify()"]
      interval: 20s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DEMO_MODE: "true"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEMO_MODE: "true"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  leaseflow-data:
  leaseflow-pg:
